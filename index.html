<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#30251f">
  <meta name="description" content="ELHELW COFFEE Distributor Management">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./assets/icon-512.png" type="image/png">
  <link rel="apple-touch-icon" href="./assets/icon-512.png">
  <link rel="stylesheet" href="./styles.css">
  <title>ELHELW COFFEE | إدارة التوزيع</title>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand"><img class="brand-logo" src="./assets/header-logo.jpg" alt="ELHELW COFFEE"><div><strong>ELHELW COFFEE</strong><small>إدارة التوزيع</small></div></div>
      <div id="user-area" class="user-area"></div>
    </header>
    <main id="main">
      <section id="setup-warning" class="panel hidden">
        <h2>إعداد الاتصال مطلوب</h2>
        <p>بيانات الاتصال غير مكتملة. راجع ملف config.js وتأكد من إعداد Supabase.</p>
      </section>
      <section id="auth-view" class="auth-card hidden">
        <div class="eyebrow">COFFEE DISTRIBUTION SYSTEM</div>
        <h1>تسجيل الدخول</h1>
        <p class="muted">استخدم الحساب الذي أنشأته الإدارة لك.</p>
        <form id="login-form">
          <label>البريد الإلكتروني<input id="email" type="email" autocomplete="username" required placeholder="name@example.com"></label>
          <label>كلمة المرور<input id="password" type="password" autocomplete="current-password" required placeholder="••••••••"></label>
          <button class="primary" type="submit">دخول</button>
          <p id="login-error" class="error"></p>
        </form>
      </section>
      <section id="workspace" class="hidden">
        <div class="welcome">
          <div><div class="eyebrow" id="role-label">WORKSPACE</div><h1 id="welcome-title">لوحة التحكم</h1><p class="muted" id="welcome-subtitle">متابعة حركة التوزيع والمخزون.</p></div>
          <button id="refresh-btn" class="secondary">تحديث البيانات ↻</button>
        </div>
        <nav id="tabs" class="tabs"></nav>
        <div id="content"></div>
      </section>
    </main>
    <footer>ELHELW COFFEE · Distributor Management</footer>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="./config.js"></script>
  <script src="./app.js"></script><script>if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js"));</script>
</body>
</html>

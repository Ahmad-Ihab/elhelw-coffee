name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, erp-development]
    paths:
      - "android-version.json"
      - ".github/workflows/android-build.yml"

concurrency:
  group: android-release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Test in-app update discovery and download states
        run: node --test erp/tests/android-updates.test.cjs

      - name: Prepare web app
        run: npm run build:web

      - name: Add Android platform
        run: npx cap add android

      - name: Set Android release version
        run: node scripts/set-android-version.js

      - name: Generate Elhelw Android launcher icons
        run: |
          npm install --no-save sharp
          node scripts/generate-android-icons.js

      - name: Register native invoice PDF printer
        run: node scripts/prepare-android.js

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Restore Android release keystore
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Missing ANDROID_KEYSTORE_BASE64 repository secret"; exit 1; }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/elhelw-release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/elhelw-release.keystore" >> "$GITHUB_ENV"

      - name: Configure release signing
        if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/elhelw-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: node scripts/configure-android-release.js

      - name: Build signed release APK
        if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/elhelw-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Read Android app version
        id: app_version
        if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        run: |
          node -e 'const v=require("./android-version.json"); console.log("name="+v.versionName); console.log("code="+v.versionCode)' >> "$GITHUB_OUTPUT"

      - name: Verify APK signature and upgrade identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/release/app-release.apk
          sdk_bin=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          mkdir -p "$RUNNER_TEMP/previous"
          gh release download erp-v2.3.0-209 --pattern app-release.apk --dir "$RUNNER_TEMP/previous"
          previous="$RUNNER_TEMP/previous/app-release.apk"
          for file in "$previous" "$apk"; do
            "$sdk_bin/apksigner" verify --verbose --print-certs "$file" > "$file.cert"
            "$sdk_bin/aapt" dump badging "$file" > "$file.badging"
          done
          diff <(grep '^Signer #1 certificate SHA-256 digest:' "$previous.cert") <(grep '^Signer #1 certificate SHA-256 digest:' "$apk.cert")
          grep -F "package: name='com.elhelwcoffee.app' versionCode='${{ steps.app_version.outputs.code }}' versionName='${{ steps.app_version.outputs.name }}'" "$apk.badging"
          test "${{ steps.app_version.outputs.code }}" -gt 57
          if "$sdk_bin/aapt" dump permissions "$apk" | grep -Fq android.permission.REQUEST_INSTALL_PACKAGES; then
            echo "Unexpected package installation permission"; exit 1
          fi
          sha256sum "$apk"
          unzip -tqq "$apk"

      - name: Upload signed release APK
        if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        uses: actions/upload-artifact@v4
        with:
          name: elhelw-distribution-android-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish Android release for in-app updates
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.app_version.outputs.name }}
          name: Elhelw Distribution v${{ steps.app_version.outputs.name }}
          body: |
            Android application release.
            versionName: ${{ steps.app_version.outputs.name }}
            versionCode: ${{ steps.app_version.outputs.code }}
          files: android/app/build/outputs/apk/release/app-release.apk
          make_latest: true
          overwrite_files: true
          fail_on_unmatched_files: true


      - name: Provide a direct APK for the ERP rollout
        if: github.ref == 'refs/heads/erp-development'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: erp-v${{ steps.app_version.outputs.name }}-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Elhelw Distribution ERP ${{ steps.app_version.outputs.name }}
          prerelease: true
          make_latest: false
          files: android/app/build/outputs/apk/release/app-release.apk
          fail_on_unmatched_files: true

  android-upgrade:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: elhelw-distribution-android-release
          path: candidate
      - name: Fetch previous release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download erp-v2.3.0-209 --pattern app-release.apk --dir previous
      - name: Permit hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Upgrade and launch on Android 13
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          script: bash scripts/check-android-upgrade.sh

  erp-update-channel:
    if: github.ref == 'refs/heads/erp-development'
    needs: android-upgrade
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish the verified Android update to ERP installations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(jq -er .versionName android-version.json)
          code=$(jq -er .versionCode android-version.json)
          tag="erp-v$version-$GITHUB_RUN_NUMBER"
          metadata=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag")
          digest=$(jq -er '.assets[] | select(.name=="app-release.apk") | .digest | select(test("^sha256:[0-9a-f]{64}$"))' <<< "$metadata")
          test "$(jq -r .target_commitish <<< "$metadata")" = "$GITHUB_SHA"
          note="$RUNNER_TEMP/erp-update.json"
          jq -n --arg tag "$tag" --arg version "$version" --argjson code "$code" --arg sha "${digest#sha256:}" \
            '{tag:$tag,versionName:$version,versionCode:$code,sha256:$sha}' > "$note"
          channel=erp-android-current
          if gh release view "$channel" --json body > "$RUNNER_TEMP/previous-feed.json"; then
            previous=$(jq -er '.body | fromjson | .versionCode' "$RUNNER_TEMP/previous-feed.json")
            if (( previous > code )); then exit 0; fi
            gh release edit "$channel" --notes-file "$note" --prerelease --latest=false
          else
            gh release create "$channel" --target "$GITHUB_SHA" --title "Elhelw Distribution – ERP Android update channel" --notes-file "$note" --prerelease --latest=false
          fi

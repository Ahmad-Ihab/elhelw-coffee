name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: APK type to build
        required: true
        default: debug
        type: choice
        options:
          - debug
          - release
  push:
    branches: [main]
    paths:
      - "app.js"
      - "index.html"
      - "styles.css"
      - "production-calculator.js"
      - "production-calculator/**"
      - "sw.js"
      - "production-calculator.css"
      - "config.js"
      - "assets/**"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.json"
      - "manifest.webmanifest"
      - "scripts/**"
      - ".github/workflows/android-build.yml"

concurrency:
  group: android-release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Prepare web app
        run: npm run build:web

      - name: Add Android platform
        run: npx cap add android

      - name: Generate Elhelw Android launcher icons
        run: |
          npm install --no-save sharp
          node scripts/generate-android-icons.js

      - name: Register native invoice PDF printer
        run: node scripts/prepare-android.js

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Restore Android release keystore
        if: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.build_type == 'release')) }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Missing ANDROID_KEYSTORE_BASE64 repository secret"; exit 1; }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/elhelw-release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/elhelw-release.keystore" >> "$GITHUB_ENV"

      - name: Configure release signing
        if: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.build_type == 'release')) }}
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/elhelw-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: node scripts/configure-android-release.js

      - name: Build signed release APK
        if: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.build_type == 'release')) }}
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/elhelw-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Build debug APK
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.build_type != 'release') }}
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Read Android app version
        id: app_version
        if: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.build_type == 'release')) }}
        run: |
          VERSION_NAME=$(grep -oP 'versionName "\K[^"]+' android/app/build.gradle)
          VERSION_CODE=$(grep -oP 'versionCode \K[0-9]+' android/app/build.gradle)
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Upload signed release APK
        if: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.build_type == 'release')) }}
        uses: actions/upload-artifact@v4
        with:
          name: elhelw-distribution-android-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish Android release for in-app updates
        if: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.build_type == 'release')) }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.app_version.outputs.name }}
          name: Elhelw Distribution v${{ steps.app_version.outputs.name }}
          body: |
            Android application release.
            versionName: ${{ steps.app_version.outputs.name }}
            versionCode: ${{ steps.app_version.outputs.code }}
          files: android/app/build/outputs/apk/release/app-release.apk
          make_latest: true
          overwrite_files: true
          fail_on_unmatched_files: true

      - name: Upload debug APK
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.build_type != 'release') }}
        uses: actions/upload-artifact@v4
        with:
          name: elhelw-distribution-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

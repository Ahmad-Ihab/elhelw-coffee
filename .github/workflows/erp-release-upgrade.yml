name: Check released ERP APK on Android
on:
  push:
    branches: [erp-development]
    paths:
      - scripts/check-android-upgrade.sh
      - .github/workflows/erp-release-upgrade.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download signed APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.7.6 --pattern app-release.apk --dir previous
          version=$(node -p "require('./android-version.json').versionName")
          tag=$(gh release list --limit 100 --json tagName,isPrerelease | jq -er --arg prefix "erp-v$version-" '[.[] | select(.isPrerelease and (.tagName|startswith($prefix)))][0].tagName')
          gh release download "$tag" --pattern app-release.apk --dir candidate
          sha256sum candidate/app-release.apk
      - name: Permit hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          script: bash scripts/check-android-upgrade.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-test-login-screen
          path: /tmp/elhelw-screen
          retention-days: 3
